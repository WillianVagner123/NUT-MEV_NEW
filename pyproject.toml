[build-system]
requires = ["pdm-backend>=2.4.3"]
build-backend = "pdm.backend"

[project]
name = "nutev-nutmev"
dynamic = ["version"]
description = "NutEV Reference Engine: taxonomy-guided multi-source reference discovery and ranking for lifestyle nutrition research"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {file = "LICENSE"}
authors = [
    {name = "Willian Vagner Dorneles Schneider"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "twine>=5",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests>=2.32",
]

[project.urls]
"Homepage" = "https://github.com/WillianVagner123/NutEV-Evidence-Engine"
"Bug Tracker" = "https://github.com/WillianVagner123/NutEV-Evidence-Engine/issues"

[project.scripts]
nutev = "nutev.cli:main"

[tool.pdm]
distribution = true
version = { source = "file", path = "src/nutev/__version__.py" }

[tool.pytest.ini_options]
testpaths = ["nutev_tests"]
markers = [
    "unit: isolated unit tests",
    "integration_no_network: integration tests that must not touch the network",
]

[tool.coverage.run]
source = ["src"]
branch = true
