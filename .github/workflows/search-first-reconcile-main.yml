name: search-first-reconcile-main

on:
  push:
    branches:
      - feat/search-classification-first-product

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Merge current main while preserving search-first surface
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Branch already contains current main."
            exit 0
          fi

          cp apps/nutev-web/styles.css /tmp/search-first-styles.css
          git merge origin/main --no-commit --no-ff || true

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          echo "Conflicts: ${conflicts:-none}"

          if grep -qx 'apps/nutev-web/product-ui.js' <<<"$conflicts"; then
            git checkout --theirs apps/nutev-web/product-ui.js
          fi
          if grep -qx 'apps/nutev-web/search.html' <<<"$conflicts"; then
            git checkout --ours apps/nutev-web/search.html
          fi
          if grep -qx 'apps/nutev-web/styles.css' <<<"$conflicts"; then
            git checkout --theirs apps/nutev-web/styles.css
          fi

          python - <<'PY'
          from pathlib import Path
          import re

          product = Path('apps/nutev-web/product-ui.js')
          text = product.read_text(encoding='utf-8')
          nav = """const NAV_GROUPS=[
            {label:'Descoberta',items:[
              {key:'dashboard',href:'/',icon:'⌂',label:'Início'},
              {key:'search',href:'/search.html',icon:'⌕',label:'Buscar artigos'},
              {key:'articles',href:'/articles.html',icon:'▤',label:'Biblioteca'},
              {key:'map',href:'/evidence-map.html',icon:'▦',label:'Mapa de evidências'},
              {key:'radar',href:'/radar.html',icon:'⌁',label:'Radar'},
              {key:'ask',href:'/ask.html',icon:'?',label:'Perguntar ao corpus'}
            ]},
            {label:'Sistema',items:[
              {key:'history',href:'/search.html?view=history',icon:'◷',label:'Minhas buscas'},
              {key:'advanced',href:'/advanced.html',icon:'⚙',label:'Laboratório avançado'}
            ]}
          ]
          """
          text, count = re.subn(r"const NAV_GROUPS=\[.*?\n\]\n\n(?=const GLOSSARY=)", nav + "\n", text, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError(f'NAV_GROUPS replacement count={count}')
          active = """function activeNavKey(){
            const path=location.pathname.replace(/\\/+$/,'')||'/'
            const params=new URLSearchParams(location.search)
            if(path==='/search.html'&&params.get('view')==='history')return 'history'
            if(path==='/')return 'dashboard'
            if(path==='/search.html')return 'search'
            if(path==='/articles.html'||path==='/evidence.html')return 'articles'
            if(path==='/evidence-map.html')return 'map'
            if(path==='/radar.html')return 'radar'
            if(path==='/ask.html')return 'ask'
            if(path==='/advanced.html')return 'advanced'
            if(path.startsWith('/validation')||[
              '/scientific-dashboard.html','/review.html','/review-routes.html','/review-qa.html',
              '/press-review.html','/regional-routes.html','/quality.html','/strategy.html',
              '/intelligence.html','/synthesis-review.html','/synthesis-brief.html',
              '/synthesis-governance.html','/synthesis-release.html','/synthesis-publication.html',
              '/evidence-claims.html','/claim-appraisal.html','/evidence-sets.html',
              '/recommendation-candidates.html','/recommendation-human-validation.html'
            ].includes(path))return 'advanced'
            return ''
          }
          """
          text, count = re.subn(r"function activeNavKey\(\)\{.*?\n\}\n\n(?=function canonicalNavHtml)", active + "\n", text, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError(f'activeNavKey replacement count={count}')
          product.write_text(text, encoding='utf-8', newline='\n')

          for name in ('search.html','articles.html'):
              path = Path('apps/nutev-web') / name
              html = path.read_text(encoding='utf-8')
              if '<nav aria-label="Navegação principal"></nav>' not in html:
                  html, count = re.subn(
                      r'<nav(?:\s+aria-label="Navegação principal")?[^>]*>.*?</nav>',
                      '<nav aria-label="Navegação principal"></nav>',
                      html,
                      count=1,
                      flags=re.S,
                  )
                  if count != 1:
                      raise RuntimeError(f'{name}: primary nav replacement count={count}')
              path.write_text(html, encoding='utf-8', newline='\n')

          search = Path('apps/nutev-web/search.html')
          html = search.read_text(encoding='utf-8')
          if 'aria-describedby="globalSearchNote"' not in html:
              html = html.replace('id="globalSearchBtn" class="global-search" title=', 'id="globalSearchBtn" class="global-search" aria-describedby="globalSearchNote" title=')
          html = html.replace('>Busca ampla</button>', '>Busca global · sem teto</button>')
          html = html.replace('<strong>Busca ampla =', '<strong>Busca global · sem teto =')
          if 'id="globalSearchNote"' not in html:
              html = html.replace('<div class="global-search-note"><strong>Busca global · sem teto', '<div id="globalSearchNote" class="global-search-note"><strong>Busca global · sem teto')
          search.write_text(html, encoding='utf-8', newline='\n')

          styles = Path('apps/nutev-web/styles.css')
          current = styles.read_text(encoding='utf-8')
          ours = Path('/tmp/search-first-styles.css').read_text(encoding='utf-8')
          marker = '/* search-classification-first-v1 */'
          if marker not in ours:
              raise RuntimeError('search-first styles marker missing from branch snapshot')
          search_first = marker + ours.split(marker, 1)[1]
          if marker not in current:
              current = current.rstrip() + '\n' + search_first.rstrip() + '\n'
          styles.write_text(current, encoding='utf-8', newline='\n')
          PY

          git add apps/nutev-web/product-ui.js apps/nutev-web/search.html apps/nutev-web/articles.html apps/nutev-web/styles.css
          unresolved="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$unresolved" ]; then
            echo "Unresolved merge conflicts:"
            echo "$unresolved"
            exit 1
          fi

          node --check apps/nutev-web/product-ui.js
          node --check apps/nutev-web/app.js
          python -m pip install --quiet pytest
          PYTHONPATH=src python -m pytest -q \
            nutev_tests/test_search_classification.py \
            nutev_tests/test_product_shell_remediation.py \
            nutev_tests/test_product_flow_p2.py

          git commit -m "merge: reconcile search-first product with guided strategy flow"
          git push origin "HEAD:${GITHUB_REF_NAME}"
