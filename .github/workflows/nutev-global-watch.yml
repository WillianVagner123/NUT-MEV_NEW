name: NutEV Global Watch
# Manual-only (workflow_dispatch): this job runs the real collection pipeline
# and would otherwise consume Actions minutes on a weekly schedule with no one
# watching. Trigger it on demand from the Actions tab when you actually want a
# scheduled-style run. (Re-add a `schedule:` cron here if you want it automatic.)
on:
  workflow_dispatch:
# Least privilege: this job only needs to read the repo (secrets are passed
# explicitly via env below). Matches ci.yml / gitleaks.yml.
permissions:
  contents: read
jobs:
  global-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Install requirements.txt (optional)
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run tests
        run: PYTHONPATH=src python -m pytest -q nutev_tests -p no:timeout
      - name: Run global watch
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          NUTEV_DIGEST_WEBHOOK_URL: ${{ secrets.NUTEV_DIGEST_WEBHOOK_URL }}
          NUTEV_NOTIFY_WEBHOOK: ${{ secrets.NUTEV_NOTIFY_WEBHOOK }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_TOOL: nutev_pipeline
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
        run: |
          PYTHONPATH=src python -m nutev.cli global-watch \
            --project-root ./project_output \
            --since-days 7 \
            --mode thesis \
            --web-enabled \
            --official-crawl \
            --capture-enabled \
            --notify-webhook \
            --resume
      - name: Build sanitized artifact
        if: always()
        run: bash .github/scripts/build-safe-artifact.sh project_output artifact_safe

      - name: Upload sanitized artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nutev-global-watch-safe
          path: artifact_safe
          retention-days: 5
          if-no-files-found: warn
