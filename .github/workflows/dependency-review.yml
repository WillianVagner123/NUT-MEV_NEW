name: dependency-review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # validated v5 line
      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        # This is intentionally blocking. A green workflow must mean that the
        # dependency-review action actually executed successfully. Repository
        # Settings > Code security & analysis > Dependency graph must therefore
        # be enabled. If GitHub reports that dependency review is unsupported,
        # the PR must stay red rather than silently converting that gap to PASS.
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
