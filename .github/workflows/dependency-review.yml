name: dependency-review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # validated v5 line
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        # This is intentionally blocking. A green workflow must mean that the
        # dependency-review action actually executed successfully. Repository
        # Settings > Code security & analysis > Dependency graph must therefore
        # be enabled. If GitHub reports that dependency review is unsupported,
        # the PR must stay red rather than silently converting that gap to PASS.
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
