name: release-validation-v0.2.0-archived

# v0.2.0 has been published. Keep this validator as a manual reproducibility
# check for the archived release only; future releases must define their own
# candidate version/tag instead of reusing v0.2.0.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-archived-release:
    name: validate archived v0.2.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # validated v5 line
        with:
          ref: v0.2.0
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # validated v6 line
        with:
          python-version: "3.12"

      - name: Verify archived release identity
        run: |
          set -euo pipefail
          test "$(git describe --tags --exact-match)" = "v0.2.0"
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          expected = "0.2.0"
          ns = {}
          exec(Path("src/nutev/__version__.py").read_text(encoding="utf-8"), ns)
          assert ns["__version__"] == expected, ns["__version__"]
          assert json.loads(Path(".zenodo.json").read_text(encoding="utf-8"))["version"] == expected
          citation = Path("CITATION.cff").read_text(encoding="utf-8")
          versions = [v.strip() for v in re.findall(r'^\s*version:\s*["\']?([^"\'\n#]+)', citation, flags=re.MULTILINE)]
          assert versions and all(v == expected for v in versions), versions
          print("Archived release identity verified: v0.2.0")
          PY

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/nutev-ci.txt
          python -m pip install --no-deps -e .
          python -m pip install build twine

      - name: Run canonical tests
        run: PYTHONPATH=src python -m pytest -q nutev_tests

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Verify zero-key wheel demo
        run: |
          set -euo pipefail
          WHEEL=$(find dist -maxdepth 1 -name 'nutev_nutmev-0.2.0-*.whl' -print -quit)
          test -n "$WHEEL"
          python -m venv /tmp/nutev-v020-archive
          /tmp/nutev-v020-archive/bin/python -m pip install --upgrade pip
          /tmp/nutev-v020-archive/bin/python -m pip install "$WHEEL"
          /tmp/nutev-v020-archive/bin/nutev demo-data --project-root /tmp/nutev-v020-demo
          test -f /tmp/nutev-v020-demo/07_logs/run_summary.json