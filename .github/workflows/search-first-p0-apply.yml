name: search-first-p0-apply

on:
  push:
    branches:
      - feat/search-first-p0-product

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Apply P0 and run full NutEV tests
        run: |
          set -euo pipefail
          if test -f nutev_tests/test_search_first_product_p0.py; then
            echo "P0 batch already applied."
            exit 0
          fi
          python tools/search_first_p0_materialize.py
          python -m pip install --quiet -r requirements/nutev-ci.txt
          python -m pip install --quiet --no-deps -e .
          node --check apps/nutev-web/app.js
          node --check apps/nutev-web/product-ui.js
          PYTHONPATH=src python -m pytest -q nutev_tests
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/nutev-web src/nutev/search/classification.py nutev_tests
          git commit -m "feat(product): close search-first P0 product boundary"
          git push origin "HEAD:${GITHUB_REF_NAME}"
