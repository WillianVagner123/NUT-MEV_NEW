name: search-classification-first-materialize

on:
  push:
    branches:
      - feat/search-classification-first-product

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Materialize search and classification first product
        run: |
          set -euo pipefail
          if grep -q "search-classification-first-v1" apps/nutev-web/styles.css; then
            echo "Search-first surface already materialized."
            exit 0
          fi
          cat tools/.materialize_search_classification_first.part* > tools/_materialize_search_classification_first.py
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/_materialize_search_classification_first.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '    text = replace_once(text, old, new, f"app.js {label}")',
              '    text = text.replace(old, new)',
          )
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          python -m py_compile tools/_materialize_search_classification_first.py
          python tools/_materialize_search_classification_first.py
          rm -f tools/_materialize_search_classification_first.py

          # The staged materializer was split only to fit connector write limits.
          # Repair this generated block from one canonical literal before syntax checks.
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/nutev-web/app.js")
          text = path.read_text(encoding="utf-8")
          start = text.index("const CLASS_LABELS=")
          end = text.index("async function renderHistory", start)
          block = r'''const CLASS_LABELS={evidence_synthesis:'Síntese de evidência',guidance:'Diretriz / guidance',primary_randomized:'Ensaio randomizado',primary_observational:'Estudo observacional',primary_qualitative:'Estudo qualitativo',review:'Revisão',unclassified:'Não classificado'};
          const CONFIDENCE_LABELS={high:'confiança alta',medium:'confiança média',low:'sinal insuficiente'};
          function inferredClass(r){const explicit=r.search_classification?.document_class;if(explicit)return explicit;const value=`${r.article_type||''} ${r.document_type_applied||''} ${r.title||''}`.toLocaleLowerCase();if(value.includes('systematic review')||value.includes('meta-analysis')||value.includes('meta analysis'))return'evidence_synthesis';if(value.includes('guideline')||value.includes('consensus statement')||value.includes('position statement'))return'guidance';if(value.includes('randomized')||value.includes('randomised'))return'primary_randomized';if(value.includes('cohort')||value.includes('cross-sectional')||value.includes('case-control'))return'primary_observational';if(value.includes('qualitative'))return'primary_qualitative';if(value.includes('review'))return'review';return'unclassified'}
          function taxonomyLabel(value){return String(value||'').split('.').filter(Boolean).slice(-2).join(' › ').replaceAll('_',' ')}
          function whyMatched(r){const c=r.search_classification||{};const q=c.query_match||{};const parts=[];if((q.title_hits||[]).length)parts.push(`título: ${(q.title_hits||[]).slice(0,5).join(', ')}`);if((q.abstract_hits||[]).length)parts.push(`resumo: ${(q.abstract_hits||[]).slice(0,5).join(', ')}`);const tax=c.taxonomy_primary||r.taxonomy_primary;if(tax)parts.push(`tema: ${taxonomyLabel(tax)}`);if(r.document_type_applied)parts.push(`sinal documental: ${r.document_type_applied}`);return parts}
          function resultCard(r){const href=r.doi?`https://doi.org/${String(r.doi).replace(/^https?:\/\/doi\.org\//i,'').replace(/^doi:/i,'')}`:(r.url||'');const id=r.pmid?`PMID ${r.pmid}`:(r.doi?`DOI ${r.doi}`:'');const c=r.search_classification||{};const klass=inferredClass(r);const confidence=c.confidence||'low';const taxonomy=c.taxonomy_primary||r.taxonomy_primary||'';const reasons=whyMatched(r);const signals=(c.signals||[]).map(x=>`${x.field}: ${x.value}`);return `<article class="result-card"><div class="result-top"><div class="rank">${esc(r.reference_rank)}</div><div style="flex:1"><h3>${esc(r.title||'(sem título)')}</h3><div class="meta"><span>${esc(r.journal||'—')}</span><span>${esc(r.year||'—')}</span><span>${esc(r.source_provider||r.source||'')}</span><span>${esc(id)}</span></div><div class="classification-row"><span class="class-pill">${esc(CLASS_LABELS[klass]||klass)}</span><span class="confidence-pill">${esc(CONFIDENCE_LABELS[confidence]||confidence)}</span>${taxonomy?`<span class="taxonomy-pill">${esc(taxonomyLabel(taxonomy))}</span>`:''}</div></div><div class="score"><strong>${Number(r.reference_score||0).toFixed(1)}</strong><span>ranking NutEV</span></div></div>${reasons.length?`<div class="why-match"><strong>Por que apareceu</strong><span>${reasons.map(esc).join(' · ')}</span></div>`:''}${signals.length?`<div class="result-signals"><strong>Base da classificação:</strong> ${signals.map(esc).join(' · ')}</div>`:''}${r.abstract?`<div class="abstract">${esc(r.abstract).slice(0,900)}${String(r.abstract).length>900?'…':''}</div>`:''}${href?`<div class="links"><a href="${esc(href)}" target="_blank" rel="noopener noreferrer">Abrir fonte ↗</a></div>`:''}</article>`}
          '''
          text = text[:start] + block + text[end:]
          path.write_text(text, encoding="utf-8", newline="\n")
          PY

          python -m py_compile src/nutev/search/classification.py apps/nutev-web/search_adapter.py apps/nutev-web/progress_search.py
          node --check apps/nutev-web/app.js
          node --check apps/nutev-web/product-ui.js
          python -m pip install --quiet pytest
          PYTHONPATH=src python -m pytest -q nutev_tests/test_search_classification.py nutev_tests/test_product_shell_remediation.py
          git add \
            apps/nutev-web/index.html \
            apps/nutev-web/scientific-dashboard.html \
            apps/nutev-web/search.html \
            apps/nutev-web/articles.html \
            apps/nutev-web/app.js \
            apps/nutev-web/styles.css \
            apps/nutev-web/product-ui.js \
            apps/nutev-web/search_adapter.py \
            apps/nutev-web/progress_search.py \
            nutev_tests/test_product_shell_remediation.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(product): make NutEV search and classification first"
          git push origin "HEAD:${GITHUB_REF_NAME}"
