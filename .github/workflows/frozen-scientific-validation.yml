name: frozen-scientific-validation

on:
  push:
    branches:
      - agent/benchmark-frozen-runtime
  workflow_dispatch:

concurrency:
  group: nutev-frozen-scientific-validation
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  FROZEN_RUNTIME_SHA: 6aa7a5fe6009776e611ca3e1506486606b05f4f6
  BENCHMARK_TOOLING_SHA: 436b48094223f3493984c8e2fe9159caeda1b51e
  QUESTIONS_SHA256: 55a0f654e49cb5a9b10249c373df168cac585167a245b828d667c7724fb64589
  PROJECT_ROOT: project_output_reference

jobs:
  frozen-runtime:
    name: frozen runtime output
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Report run start to scientific gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/1099/comments" -f body="Frozen scientific validation automation started. Run ID: ${GITHUB_RUN_ID}; workflow commit: ${GITHUB_SHA}; candidate runtime: ${FROZEN_RUNTIME_SHA}. No relevance labels or metrics are generated at this stage."

      - name: Checkout exact frozen runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FROZEN_RUNTIME_SHA }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify identity and install frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$FROZEN_RUNTIME_SHA"
          python -m pip install --upgrade pip
          python -m pip install -r requirements/nutev-ci.txt
          python -m pip install --no-deps -e .

      - name: Execute normal frozen Reference Engine workflow
        shell: bash
        run: |
          set +e
          python tools/run_everything_now.py --project-root "$PROJECT_ROOT"
          collect=$?
          python tools/run_latin_sources.py --project-root "$PROJECT_ROOT"
          latin=$?
          python tools/rank_references.py --project-root "$PROJECT_ROOT" --config-dir ./config --top-n 100
          ranking=$?
          printf '%s\n' "$collect" > collection_exit_code.txt
          printf '%s\n' "$latin" > latin_exit_code.txt
          printf '%s\n' "$ranking" > ranking_exit_code.txt
          printf 'collection=%s\nlatin=%s\nranking=%s\n' "$collect" "$latin" "$ranking"
          exit 0

      - name: Assemble immutable runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="frozen_runtime_bundle"
          ranking_dir="$PROJECT_ROOT/reference_ranking"
          mkdir -p "$bundle"
          cp collection_exit_code.txt latin_exit_code.txt ranking_exit_code.txt "$bundle/"
          cat > "$bundle/runtime_identity.txt" <<EOF
          candidate_runtime_sha=$(git rev-parse HEAD)
          expected_candidate_runtime_sha=$FROZEN_RUNTIME_SHA
          github_workflow_sha=$GITHUB_SHA
          github_run_id=$GITHUB_RUN_ID
          github_run_attempt=$GITHUB_RUN_ATTEMPT
          generated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          for name in reference_ranking.jsonl AUDIT_MANIFEST.json latest.json reference_ranking.csv reference_quarantine.jsonl TOP_REFERENCIAS.md; do
            if [ -f "$ranking_dir/$name" ]; then cp "$ranking_dir/$name" "$bundle/$name"; fi
          done
          if [ -d "$PROJECT_ROOT" ]; then
            tar -czf "$bundle/project_output_reference.tar.gz" "$PROJECT_ROOT"
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          b = Path('frozen_runtime_bundle')
          ranking_code = int((b / 'ranking_exit_code.txt').read_text().strip())
          required = ['reference_ranking.jsonl', 'AUDIT_MANIFEST.json', 'latest.json']
          status = {
              'candidate_runtime_sha': '6aa7a5fe6009776e611ca3e1506486606b05f4f6',
              'ranking_exit_code': ranking_code,
              'required_files': {x: (b / x).is_file() for x in required},
              'benchmark_runtime_ready': ranking_code == 0 and all((b / x).is_file() for x in required),
          }
          if (b / 'AUDIT_MANIFEST.json').is_file():
              json.loads((b / 'AUDIT_MANIFEST.json').read_text(encoding='utf-8'))
          (b / 'RUNTIME_BUNDLE_STATUS.json').write_text(json.dumps(status, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          find "$bundle" -maxdepth 1 -type f ! -name bundle_sha256.txt -print0 | sort -z | xargs -0 sha256sum > "$bundle/bundle_sha256.txt"

      - name: Upload frozen runtime artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frozen-runtime-6aa7a5fe6009776e611ca3e1506486606b05f4f6
          path: frozen_runtime_bundle
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Enforce benchmark-grade runtime output
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat ranking_exit_code.txt)" = "0"
          test -s frozen_runtime_bundle/reference_ranking.jsonl
          test -s frozen_runtime_bundle/AUDIT_MANIFEST.json
          test -s frozen_runtime_bundle/latest.json
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path('frozen_runtime_bundle/RUNTIME_BUNDLE_STATUS.json').read_text())
          if not s['benchmark_runtime_ready']:
              raise SystemExit('Frozen runtime bundle is not benchmark-ready')
          PY

      - name: Report runtime stage outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/1099/comments" -f body="Frozen runtime stage ${JOB_STATUS}. Run ID: ${GITHUB_RUN_ID}. Expected artifact: frozen-runtime-${FROZEN_RUNTIME_SHA}. Candidate SHA remains ${FROZEN_RUNTIME_SHA}. No relevance labels, gold standard, external-test evidence, or metrics were created."

  validation-prehuman:
    name: label-blind validation pool and assessor packets
    needs: frozen-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout fixed benchmark tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BENCHMARK_TOOLING_SHA }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify tooling identity and install
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BENCHMARK_TOOLING_SHA"
          python -m pip install --upgrade pip
          python -m pip install -r requirements/nutev-ci.txt
          python -m pip install --no-deps -e .

      - name: Download frozen runtime artifact
        uses: actions/download-artifact@0d2ec9d4cbcefe257d822f108de2a1f15f8da9f6 # v7.0.0
        with:
          name: frozen-runtime-6aa7a5fe6009776e611ca3e1506486606b05f4f6
          path: frozen_runtime_bundle

      - name: Build label-blind validation gate artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          q = Path('validation/data/QUESTIONS.csv')
          m = json.loads(Path('validation/data/QUESTIONS_FREEZE_MANIFEST.json').read_text(encoding='utf-8'))
          actual = hashlib.sha256(q.read_bytes()).hexdigest()
          expected = '55a0f654e49cb5a9b10249c373df168cac585167a245b828d667c7724fb64589'
          if actual != expected or m.get('questions_sha256') != expected or m.get('status') != 'PASS':
              raise SystemExit('Question freeze chain mismatch')
          identity = Path('frozen_runtime_bundle/runtime_identity.txt').read_text(encoding='utf-8')
          if 'candidate_runtime_sha=6aa7a5fe6009776e611ca3e1506486606b05f4f6' not in identity:
              raise SystemExit('Frozen runtime identity mismatch')
          json.loads(Path('frozen_runtime_bundle/AUDIT_MANIFEST.json').read_text(encoding='utf-8'))
          PY
          python tools/build_scientific_benchmark_rankings.py \
            --questions validation/data/QUESTIONS.csv \
            --frozen-ranking frozen_runtime_bundle/reference_ranking.jsonl \
            --candidate-sha "$FROZEN_RUNTIME_SHA" \
            --output validation/data/BENCHMARK_RANKINGS.csv \
            --manifest validation/data/BENCHMARK_RANKINGS_MANIFEST.json
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('validation/data/BENCHMARK_RANKINGS_MANIFEST.json').read_text(encoding='utf-8'))
          assert m.get('label_blind_build') is True
          assert m.get('gold_standard_consumed') is False
          assert m.get('candidate_runtime_sha') == '6aa7a5fe6009776e611ca3e1506486606b05f4f6'
          PY
          python tools/build_blinded_judgment_pool.py \
            --rankings validation/data/BENCHMARK_RANKINGS.csv \
            --metadata frozen_runtime_bundle/reference_ranking.jsonl \
            --systems nutev_full,lexical_baseline \
            --split validation \
            --depth 100 \
            --blinded-output validation/data/VALIDATION_BLINDED_POOL.csv \
            --audit-output validation/data/VALIDATION_POOL_AUDIT.csv \
            --manifest validation/data/VALIDATION_POOL_MANIFEST.json
          python tools/build_assessor_packets.py \
            --pool validation/data/VALIDATION_BLINDED_POOL.csv \
            --assessor-id assessor_A \
            --assessor-id assessor_B \
            --output-dir validation/data/validation_assessor_packets \
            --manifest validation/data/VALIDATION_ASSESSOR_PACKETS_MANIFEST.json
          python - <<'PY'
          import csv, json
          from pathlib import Path
          prohibited = {'reference_score','reference_rank','taxonomy_primary','taxonomy_secondary','taxonomy_groups','taxonomy_group_scores','system','systems','system_origin','nutev_score','nutev_rank'}
          packet_dir = Path('validation/data/validation_assessor_packets')
          packets = sorted(packet_dir.glob('*.csv'))
          if len(packets) < 2:
              raise SystemExit('Expected two assessor packets')
          summary = []
          for p in packets:
              with p.open(encoding='utf-8-sig', newline='') as f:
                  r = csv.DictReader(f)
                  leak = set(r.fieldnames or []) & prohibited
                  if leak: raise SystemExit(f'Packet blindness leak: {sorted(leak)}')
                  rows = list(r)
              if not rows: raise SystemExit(f'Empty packet: {p.name}')
              summary.append({'file': p.name, 'rows': len(rows)})
          with Path('validation/data/VALIDATION_BLINDED_POOL.csv').open(encoding='utf-8-sig', newline='') as f:
              r = csv.DictReader(f)
              leak = set(r.fieldnames or []) & prohibited
              if leak: raise SystemExit(f'Pool blindness leak: {sorted(leak)}')
              pool_rows = sum(1 for _ in r)
          status = {
              'status': 'HUMAN_INITIAL_ASSESSMENT_GATE_READY',
              'split': 'validation',
              'candidate_runtime_sha': '6aa7a5fe6009776e611ca3e1506486606b05f4f6',
              'benchmark_tooling_sha': '436b48094223f3493984c8e2fe9159caeda1b51e',
              'questions_sha256': '55a0f654e49cb5a9b10249c373df168cac585167a245b828d667c7724fb64589',
              'pool_rows': pool_rows,
              'assessor_packets': summary,
              'minimum_independent_assessors_required': 2,
              'external_test_built': False,
              'metrics_calculated': False,
              'gold_standard_created': False,
          }
          Path('validation/data/HUMAN_GATE_READY.json').write_text(json.dumps(status, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          mkdir -p assessor_safe_bundle validation_audit_bundle
          cp validation/data/HUMAN_GATE_READY.json validation/data/VALIDATION_ASSESSOR_PACKETS_MANIFEST.json assessor_safe_bundle/
          cp validation/data/validation_assessor_packets/*.csv assessor_safe_bundle/
          cp validation/data/QUESTIONS_FREEZE_MANIFEST.json validation/data/BENCHMARK_RANKINGS.csv validation/data/BENCHMARK_RANKINGS_MANIFEST.json validation/data/VALIDATION_POOL_AUDIT.csv validation/data/VALIDATION_POOL_MANIFEST.json validation/data/HUMAN_GATE_READY.json validation_audit_bundle/
          cp frozen_runtime_bundle/runtime_identity.txt frozen_runtime_bundle/bundle_sha256.txt validation_audit_bundle/

      - name: Upload assessor-safe packets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-assessor-packets-6aa7a5fe6009776e611ca3e1506486606b05f4f6
          path: assessor_safe_bundle
          if-no-files-found: error
          retention-days: 90

      - name: Upload segregated validation audit artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-audit-DO-NOT-SHOW-ASSESSORS-6aa7a5fe6009776e611ca3e1506486606b05f4f6
          path: validation_audit_bundle
          if-no-files-found: error
          retention-days: 90

      - name: Report human gate outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            body="Validation pre-human stage SUCCESS. Run ID: ${GITHUB_RUN_ID}. Safe assessor artifact: validation-assessor-packets-${FROZEN_RUNTIME_SHA}. Segregated audit artifact: validation-audit-DO-NOT-SHOW-ASSESSORS-${FROZEN_RUNTIME_SHA}. Status: HUMAN_INITIAL_ASSESSMENT_GATE_READY. External-test was not built; no relevance labels, gold standard, or metrics were generated."
          else
            body="Validation pre-human stage ${JOB_STATUS}. Run ID: ${GITHUB_RUN_ID}. The automation did not declare the human assessment gate ready. External-test remains unopened and no scientific promotion is claimed."
          fi
          gh api "repos/${GITHUB_REPOSITORY}/issues/1099/comments" -f body="$body"
