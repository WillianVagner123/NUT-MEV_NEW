name: release-artifact-validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-clean-install:
    name: build, twine check, clean wheel install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify release identity metadata are synchronized
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          ns = {}
          exec(Path("src/nutev/__version__.py").read_text(encoding="utf-8"), ns)
          expected = ns["__version__"]
          assert expected and ".dev" not in expected, expected
          assert json.loads(Path(".zenodo.json").read_text(encoding="utf-8"))["version"] == expected
          citation = Path("CITATION.cff").read_text(encoding="utf-8")
          versions = [v.strip() for v in re.findall(r'^\s*version:\s*["\']?([^"\'\n#]+)', citation, flags=re.MULTILINE)]
          assert versions and all(v == expected for v in versions), versions
          assert "NutEV Reference Engine" in Path("README.md").read_text(encoding="utf-8")
          print("release identity synchronized:", expected)
          PY

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          test -n "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"

      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --upgrade pip
          WHEEL="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          .release-venv/bin/python -m pip install "$WHEEL"
          .release-venv/bin/python -m pip check
          EXPECTED="$(python - <<'PY'
          ns = {}
          exec(open('src/nutev/__version__.py', encoding='utf-8').read(), ns)
          print(ns['__version__'])
          PY
          )"
          ACTUAL="$(.release-venv/bin/python -c "from importlib.metadata import version; print(version('nutev-nutmev'))")"
          test "$ACTUAL" = "$EXPECTED"
          .release-venv/bin/nutev --help

      - name: Zero-key demo from installed wheel
        run: |
          .release-venv/bin/nutev demo-data --project-root ./project_output_release_validation
          test -f ./project_output_release_validation/07_logs/run_summary.json
          .release-venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          path = Path('project_output_release_validation/07_logs/run_summary.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          if not isinstance(payload, dict) or not payload:
              raise SystemExit('zero-key run_summary.json is missing or empty')
          print('zero-key run summary validated:', path)
          PY
