name: article1-latin-pilot

on:
  workflow_dispatch:
  push:
    branches:
      - audit/a1-pubmed-pilot-2026-08-25
    paths:
      - .github/workflows/article1-latin-pilot.yml
      - tools/run_latin_sources.py

permissions:
  contents: read

jobs:
  latin-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install runtime dependency
        run: python -m pip install requests
      - name: Run native regional PILOT
        run: >-
          python tools/run_latin_sources.py
          --project-root a1_latin_pilot
          --query '(diet OR dietary OR nutrition OR "healthy eating") AND (guideline OR guidance OR recommendation OR consensus OR statement OR standard)'
      - name: Upload regional audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article1-latin-pilot-${{ github.run_id }}
          path: a1_latin_pilot/
          if-no-files-found: error
