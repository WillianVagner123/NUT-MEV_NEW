name: "New source / provider"
description: "Propor nova fonte oficial, base ou provider para o Reference Engine"
labels: ["new-source"]
body:
  - type: markdown
    attributes:
      value: |
        Proponha apenas fontes que possam ser integradas mantendo identidade do provider,
        termos de uso e comportamento de falha explícitos. Compartilhe URLs/metadados,
        não PDFs protegidos.
  - type: input
    id: name
    attributes:
      label: Nome da fonte / organização / provider
    validations:
      required: true
  - type: dropdown
    id: source-type
    attributes:
      label: Tipo
      options:
        - base bibliográfica pública
        - fonte oficial / institucional
        - guideline body / sociedade científica
        - provider web opcional
        - base licenciada
        - outro
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL oficial / documentação da API
    validations:
      required: true
  - type: textarea
    id: access
    attributes:
      label: Forma de acesso
      description: API, página pública, credencial, licença, rate limit e paginação conhecidos.
    validations:
      required: true
  - type: textarea
    id: relevance
    attributes:
      label: Relevância para Nutrição do Estilo de Vida
      description: Explique que cobertura essa fonte acrescenta e por que ela pertence ao Reference Engine.
    validations:
      required: true
  - type: textarea
    id: metadata
    attributes:
      label: Metadados disponíveis
      description: Título, abstract, DOI, PMID, autores, ano, URL, keywords, tipo documental etc.
    validations:
      required: false
  - type: textarea
    id: terms
    attributes:
      label: Termos de uso / redistribuição
      description: Informe o que pode ser consultado e o que pode ser armazenado/redistribuído. Se não souber, diga explicitamente.
    validations:
      required: true
  - type: checkboxes
    id: guardrails
    attributes:
      label: Guardrails
      options:
        - label: A integração proposta preservará a identidade real do provider.
          required: true
        - label: Resultados não serão simulados se o provider estiver indisponível.
          required: true
        - label: Não estou anexando texto completo protegido sem direito de redistribuição.
          required: true
